stripe.provider.create.payment.url=http://localhost:8083/v1/payments

# Enable Circuit Breaker metrics in Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.enabled=true
management.health.circuitbreakers.enabled=true
management.endpoint.health.show-details=always


# Resilience4j Circuit Breaker configurations
resilience4j.circuitbreaker.instances.payment-processing-service001.failureRateThreshold=40
resilience4j.circuitbreaker.instances.payment-processing-service001.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.payment-processing-service001.waitDurationInOpenState=300s
resilience4j.circuitbreaker.instances.payment-processing-service001.register-health-indicator=true
resilience4j.circuitbreaker.instances.payment-processing-service001.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.payment-processing-service001.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.payment-processing-service001.slidingWindowSize=10
resilience4j.circuitbreaker.instances.payment-processing-service001.slidingWindowType=COUNT_BASED

