mytestkey=This value is from DEV properties file

#Disable active mq
spring.jms.listener.auto-startup=false


# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/process-service?useSSL=false&serverTimezone=UTC
#spring.datasource.url=jdbc:mysql://feb25-database-1.cf8oqceysoy9.ap-south-1.rds.amazonaws.com:3306/payments
spring.datasource.username=payments
#spring.datasource.password=<Reading from secret manager>
spring.datasource.initialization-mode=always

# Connection Pool Settings (HikariCP)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

logging.level.org.springframework.jdbc=DEBUG
logging.level.com.zaxxer.hikari=DEBUG


#Spring JDBC Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.sql.init.platform=mysql
spring.jpa.hibernate.ddl-auto=update  # Options: create, update, validate, none

stripe.provider.create.payment.url=http://localhost:8083/v1/payments

# Enable Circuit Breaker metrics in Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.enabled=true
management.health.circuitbreakers.enabled=true
management.endpoint.health.show-details=always


# Resilience4j Circuit Breaker configurations
resilience4j.circuitbreaker.instances.suryaCart-payment-processing-service.failureRateThreshold=40
resilience4j.circuitbreaker.instances.suryaCart-payment-processing-service.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.suryaCart-payment-processing-service.waitDurationInOpenState=300s
resilience4j.circuitbreaker.instances.suryaCart-payment-processing-service.register-health-indicator=true
resilience4j.circuitbreaker.instances.suryaCart-payment-processing-service.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.suryaCart-payment-processing-service.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.suryaCart-payment-processing-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.suryaCart-payment-processing-service.slidingWindowType=COUNT_BASED

#start CLI: stripe listen --forward-to 3.110.167.216:8082/stripe/webhook


#stripe.endPointSecret==<Reading from secret manager>

logging.level.com.hulkhiretech=debug
management.tracing.enabled=true
management.tracing.sampling.probability=1.0

spring.config.import=aws-secretsmanager:dev/payment-processing-service


